name: Update NBA Stats and AI Predictions

on:
  # Run automatically every day at 8:00 AM UTC (3:00 AM EST)
  schedule:
    - cron: '0 8 * * *'
  # Allow manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        lfs: true
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r backend/requirements_production.txt --extra-index-url https://download.pytorch.org/whl/cpu

    - name: Run Web Scraper (Update Season Averages)
      run: |
        python backend/scripts/scrape_season_stats.py

    - name: Run AI Predictions Generator (Update predictions_cache.json)
      run: |
        python backend/scripts/generate_predictions_cache.py

    # Per-game predictions need the game archive (Postgres) and are skipped without a DATABASE_URL
    # secret. The trained model is git-ignored, so it is retrained from the archive first.
    # (A step's own env is not visible to its `if`, so a separate step checks for the secret.)
    - name: Check for the game archive secret
      id: per-game
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: echo "enabled=$([ -n "$DATABASE_URL" ] && echo true || echo false)" >> $GITHUB_OUTPUT

    - name: Per-game predictions (Update game_predictions_cache.json)
      if: steps.per-game.outputs.enabled == 'true'
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python backend/scripts/train_game_model.py
        python backend/scripts/generate_game_predictions_cache.py

    - name: Check for modified files
      id: git-check
      run: |
        git status --porcelain
        echo "changed=$(git status --porcelain | wc -l)" >> $GITHUB_OUTPUT

    - name: Commit and Push changes
      if: steps.git-check.outputs.changed > 0
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add backend/data/nba_2025_26_data.pkl backend/data/predictions_cache.json
        git add backend/data/game_predictions_cache.json 2>/dev/null || true
        # No [skip ci]: Netlify skips builds for it, and the frontend build prerenders today's
        # projections from these caches (frontend/scripts/prerender.mjs), so this commit must deploy.
        # Pushes made with GITHUB_TOKEN don't start new workflow runs, so this can't loop.
        git commit -m "chore: Auto-update NBA season stats and AI predictions"
        git push origin HEAD:${{ github.ref_name }} || git push
