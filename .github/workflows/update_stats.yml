name: Update NBA Stats and AI Predictions

on:
  # Run automatically every day at 8:00 AM UTC (3:00 AM EST)
  schedule:
    - cron: '0 8 * * *'
  # Allow manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r Backend/requirements_production.txt --extra-index-url https://download.pytorch.org/whl/cpu
        # Optional: install playwright browsers if the scraper needs it
        python -m playwright install chromium

    - name: Run Web Scraper (Update Season Averages)
      run: |
        python Backend/nba_web_scraper.py

    - name: Run AI Predictions Generator (Update predictions_cache.json)
      run: |
        python Backend/generate_predictions_cache.py

    - name: Check for modified files
      id: git-check
      run: |
        git status --porcelain
        echo "changed=$(git status --porcelain | wc -l)" >> $GITHUB_OUTPUT

    - name: Commit and Push changes
      if: steps.git-check.outputs.changed > 0
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add Backend/nba_2025_26_data.pkl Backend/predictions_cache.json
        git commit -m "chore: Auto-update NBA season stats and AI predictions [skip ci]"
        git push origin main
